function getSmartAlternatives(exId,ath){
  const ex=EX_DB[exId];if(!ex)return[];
  const injLower=(ath.injuries||'').toLowerCase();
  const weakLower=(ath.weaknesses||'').toLowerCase();
  const level={beginner:0,intermediate:1,advanced:2,elite:3}[ath.level||'intermediate']||1;
  const alts=[];

  // Direct alternatives from EX_ALT
  (EX_ALT[exId]||[]).forEach(id=>{
    const altEx=EX_DB[id];if(!altEx)return;
    if(altEx.level>level)return; // too advanced
    let reason='Variación directa';
    if(id.includes('power'))reason='Versión de potencia (más técnica, menos carga)';
    if(id.includes('hang'))reason='Desde colgado — mejora la fase de tracción';
    if(id.includes('pause'))reason='Con pausa — refuerza fuerza en posición inferior';
    if(id.includes('pull'))reason='Tirón — fortalece la cadena de tracción';
    alts.push({id,reason,type:'direct'});
  });

  // Pattern-based alternatives
  const samePattern=Object.keys(EX_DB).filter(id=>{
    const e=EX_DB[id];
    return e.pattern===ex.pattern&&id!==exId&&e.level<=level&&!alts.find(a=>a.id===id);
  });
  samePattern.slice(0,3).forEach(id=>{
    alts.push({id,reason:`Mismo patrón (${EX_DB[id].pattern}) — compatible con tu plan`,type:'pattern'});
  });

  // Injury-specific
  if(injLower.includes('rodilla')&&ex.pattern==='squat'){
    const safeOpts=['leg_press','rdl','hip_thrust'].filter(id=>!alts.find(a=>a.id===id));
    safeOpts.forEach(id=>{if(EX_DB[id])alts.push({id,reason:'⚠ Opción segura con lesión de rodilla',type:'injury'});});
  }
  if(injLower.includes('lumbar')&&(ex.pattern==='hinge'||ex.id==='deadlift')){
    const safeOpts=['rdl','leg_curl','leg_press'].filter(id=>!alts.find(a=>a.id===id));
    safeOpts.forEach(id=>{if(EX_DB[id])alts.push({id,reason:'⚠ Opción segura con restricción lumbar',type:'injury'});});
  }

  // Weakness-based
  if(weakLower.includes('salida')&&(exId==='deadlift'||exId==='squat')){
    if(!alts.find(a=>a.id==='deficit_dl'))alts.push({id:'deficit_dl',reason:'🎯 Corrige fuerza en la salida del suelo',type:'weakness'});
  }
  if(weakLower.includes('lockout')&&exId==='deadlift'){
    if(!alts.find(a=>a.id==='rack_pull'))alts.push({id:'rack_pull',reason:'🎯 Fortalece el rango de lockout',type:'weakness'});
  }
  if(weakLower.includes('recepción')&&exId==='snatch'){
    if(!alts.find(a=>a.id==='overhead_squat'))alts.push({id:'overhead_squat',reason:'🎯 Mejora la recepción de la arrancada',type:'weakness'});
  }

  return alts.slice(0,8);
}

// Genera 3-5 variantes de sesión según objetivos del atleta
function generateRoutineVariants(ath){
  const sport=ath.sport;const level=ath.level||'intermediate';const goal=ath.goal||'strength';
  const mainLifts=getMainLifts(sport);
  const variants=[];

  // Variante A: Foco en levantamiento principal (clásico)
  variants.push({
    id:'classic',title:'Clásica — Foco Principal',
    type:sport,
    desc:`Alta especificidad. Trabajo principal al ${sport==='wl'?'80-90%':'80-90%'} con rampa progresiva.`,
    focus:'Especificidad competitiva',
    exercises:mainLifts.slice(0,sport==='both'?3:2).map(id=>({
      exerciseId:id,isMain:true,
      sets:level==='beginner'?3:level==='advanced'||level==='elite'?5:4,
      repsScheme:goal==='strength'?'3-5':goal==='power'?'2-3':'5-6',
    })),
    accessories:getPatternAccessories(sport,['pull','push'],level).slice(0,2),
  });

  // Variante B: Alta frecuencia / volumen
  variants.push({
    id:'volume',title:'Volumen — Alta Frecuencia',
    type:sport,
    desc:'Más series con menor intensidad. Ideal para fase de acumulación.',
    focus:'Volumen de entrenamiento',
    exercises:mainLifts.map(id=>({
      exerciseId:id,isMain:true,
      sets:level==='elite'?6:5,repsScheme:'5-6',
    })),
    accessories:getPatternAccessories(sport,['hinge','squat'],level).slice(0,3),
  });

  // Variante C: Técnica / Velocidad
  variants.push({
    id:'tech',title:'Técnica — Velocidad de Barra',
    type:sport,
    desc:`Series cortas al 60-70%. Enfoque en calidad de movimiento y velocidad.`,
    focus:'Técnica y coordinación',
    exercises:mainLifts.slice(0,2).map(id=>({
      exerciseId:id,isMain:true,
      sets:6,repsScheme:'2-3',
    })),
    accessories:getPatternAccessories(sport,['push','pull'],level).slice(0,2),
  });

  // Variante D: Mixta WL + PL (si corresponde)
  if(sport==='both'){
    variants.push({
      id:'mixed',title:'Mixta — WL + PL',
      type:'both',
      desc:'Combina Dos Tiempos o Arrancada con Sentadilla y Press en la misma sesión.',
      focus:'Transferencia y atletismo',
      exercises:[
        {exerciseId:'clean_jerk',isMain:true,sets:4,repsScheme:'2+2'},
        {exerciseId:'squat',isMain:true,sets:4,repsScheme:'4'},
        {exerciseId:'bench',isMain:false,sets:3,repsScheme:'6'},
      ],
      accessories:['rdl','face_pull'].filter(id=>EX_DB[id]).map(id=>({exerciseId:id,isMain:false,sets:3,repsScheme:'8'})),
    });
  }

  // Variante E: Correctivos según puntos débiles
  const weak=ath.weaknesses||'';
  if(weak){
    const corrEx=getCorrectives(weak,sport,level);
    if(corrEx.length){
      variants.push({
        id:'corrective',title:'Correctivos — Puntos Débiles',
        type:sport,
        desc:`Sesión orientada a corregir: ${weak.slice(0,60)}`,
        focus:'Corrección y desarrollo',
        exercises:corrEx,
        accessories:[],
      });
    }
  }
  return variants;
}

function getPatternAccessories(sport,patterns,level){
  const lvl={beginner:0,intermediate:1,advanced:2,elite:3}[level]||1;
  return patterns.flatMap(pat=>
    Object.keys(EX_DB).filter(id=>{
      const e=EX_DB[id];
      return e.pattern===pat&&!e.olympic&&e.level<=lvl&&(sport==='both'||e.sport===sport||e.sport==='both');
    }).slice(0,2)
  );
}

function getCorrectives(weaknesses,sport,level){
  const w=weaknesses.toLowerCase();const correctives=[];
  if(w.includes('salida')||w.includes('suelo'))correctives.push({exerciseId:'deficit_dl',isMain:false,sets:4,repsScheme:'4'});
  if(w.includes('lockout'))correctives.push({exerciseId:'rack_pull',isMain:false,sets:4,repsScheme:'3'});
  if(w.includes('recepción')||w.includes('overhead'))correctives.push({exerciseId:'overhead_squat',isMain:false,sets:5,repsScheme:'3'});
  if(w.includes('frontal')||w.includes('clean'))correctives.push({exerciseId:'front_squat',isMain:false,sets:4,repsScheme:'4'});
  if(w.includes('jalón')||w.includes('tirón'))correctives.push({exerciseId:'snatch_pull',isMain:false,sets:4,repsScheme:'3'});
  if(w.includes('core')||w.includes('abdomen'))correctives.push({exerciseId:'ab_work',isMain:false,sets:4,repsScheme:'15'});
  // Add main lift reduced
  const main=getMainLifts(sport)[0];
  if(main&&!correctives.find(e=>e.exerciseId===main))
    correctives.unshift({exerciseId:main,isMain:true,sets:4,repsScheme:'3'});
  return correctives.slice(0,5);
}

// ── ANÁLISIS DE FATIGA ────────────────────────────────────
function calcFatigueAdjustment(ath){
  const hist=(ath.feedbackHistory||[]).slice(-5); // últimas 5 sesiones
  if(hist.length<3)return{adjust:false};
  const enArr=hist.filter(h=>h.energy);const avgEnergy=enArr.length?enArr.reduce((s,h)=>s+h.energy,0)/enArr.length:null;
  const feArr=hist.filter(h=>h.feel!=null);const avgFeel=feArr.length?feArr.reduce((s,h)=>s+h.feel,0)/feArr.length:null;
  const hasPain=hist.some(h=>h.pain&&h.pain.length>0&&!h.pain.includes(6)); // 6 = sin dolor
  const lowEnergy=avgEnergy!=null&&avgEnergy<4;const lowFeel=avgFeel!=null&&avgFeel<1.5; // índices bajos
  if(hasPain&&(lowEnergy||lowFeel)){
    return{adjust:true,pct:-10,reason:`Detectamos fatiga acumulada: energía promedio ${avgEnergy!=null?avgEnergy.toFixed(1):'—'}/10 en las últimas ${hist.length} sesiones + dolor reportado.`,action:'Reducir cargas 10% esta semana y priorizar técnica sobre intensidad.'};
  }
  if(lowEnergy&&lowFeel){
    return{adjust:true,pct:-7,reason:`Energía promedio baja (${avgEnergy!=null?avgEnergy.toFixed(1):'—'}/10) en las últimas ${hist.length} sesiones.`,action:'Reducir cargas 7% y considerar una semana de deload.'};
  }
  return{adjust:false};
}

async function applyFatigueAdj(pct){
  const ath=getAth();if(!ath)return;
  // Apply to all plan days in current week
  const wid=S.ui.viewWeekId;
  const plan=(S.weekPlans[ath.id]||{})[wid]||[];
  plan.filter(p=>p.status!=='done').forEach(dp=>{
    const sess=getSess(dp.sessionId);if(!sess)return;
    sess.exercises.forEach(ex=>{
      ex.sets.forEach(st=>{
        if(st.pct)st.pct=Math.max(50,Math.round(st.pct*(1+pct/100)));
      });
    });
  });
  ath.fatigueAdj={date:new Date().toISOString().split('T')[0],pct,applied:true};
  await saveState();toast(`Cargas ajustadas ${pct}% ✓`,'success');goView('ath-home');
}

// ────────────────────────────────────────────────
// DUP — Daily Undulating Periodization
// ────────────────────────────────────────────────
const DUP_TYPES = {
  heavy:    {label:'Pesado',    pctRange:[82,92], reps:'2-3', sets:5, rest:300, color:'var(--danger)',  cls:'dup-heavy'},
  moderate: {label:'Moderado',  pctRange:[72,80], reps:'4-6', sets:4, rest:210, color:'var(--or)',      cls:'dup-moderate'},
  light:    {label:'Liviano',   pctRange:[60,70], reps:'8-10',sets:3, rest:120, color:'var(--ok)',      cls:'dup-light'},
  speed:    {label:'Velocidad', pctRange:[55,65], reps:'2-3', sets:6, rest:150, color:'var(--pl)',      cls:'dup-speed'},
};

// DUP rotation patterns
const DUP_PATTERNS = {
  3: ['heavy','light','moderate'],
  4: ['heavy','light','moderate','speed'],
  5: ['heavy','light','moderate','speed','heavy'],
  6: ['heavy','light','moderate','speed','heavy','light'],
};

function generateDUPWeek(ath, weekNum=1){
  const days=ath.days||3;
  const pattern=DUP_PATTERNS[days]||DUP_PATTERNS[3];
  const mainLifts=getMainLifts(ath.sport);
  const trainIdxs=getTrainDayIdxs(days);
  // Progressive overload: increase pct range slightly each week
  const wkBonus=Math.min((weekNum-1)*2, 8); // +2%/sem max +8%
  const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  return trainIdxs.map((dayIdx,di)=>{
    const dupType=DUP_TYPES[pattern[di%pattern.length]];
    const pctLow=dupType.pctRange[0]+wkBonus;const pctHigh=dupType.pctRange[1]+wkBonus;
    const exercises=mainLifts.map(liftId=>{
      const orm=ath.oneRMs?.[liftId]?.value;
      const midPct=(pctLow+pctHigh)/2;
      const load=orm?roundLoad(orm*(midPct/100),liftId):null;
      return{
        exerciseId:liftId,
        isMain:true,
        dupType:pattern[di%pattern.length],
        sets:dupType.sets,
        reps:dupType.reps,
        pctLow,pctHigh,
        prescribedLoad:load,
        rest:dupType.rest,
      };
    });
    return{dayIdx,dayName:DAYS[dayIdx],dupType:pattern[di%pattern.length],exercises};
  });
}

async function applyDUPWeek(weekNum){
  const ath=getAth();if(!ath)return;
  const dupDays=generateDUPWeek(ath,weekNum);
  const weekDates=getWeekDates(WEEK_ID);
  if(!S.sessions[ath.id])S.sessions[ath.id]={};
  if(!S.weekPlans[ath.id])S.weekPlans[ath.id]={};
  const plan=[];
  const DT=DUP_TYPES;
  dupDays.forEach(day=>{
    const dt=weekDates[day.dayIdx];if(!dt)return;
    const dateStr=dt.toISOString().split('T')[0];
    const sessId=`dup_${dateStr}`;
    const dupT=DT[day.dupType];
    S.sessions[ath.id][sessId]={
      id:sessId,
      name:`DUP ${dupT.label} — ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][day.dayIdx]}`,
      sport:ath.sport,isDUP:true,dupType:day.dupType,
      exercises:day.exercises.map(ex=>({
        exerciseId:ex.exerciseId,
        sets:Array.from({length:ex.sets},()=>({reps:ex.reps,pct:Math.round((ex.pctLow+ex.pctHigh)/2)})),
      })),
      updatedAt:Date.now()
    };
    plan.push({day:day.dayIdx,sessionId:sessId,status:'pending'});
  });
  S.weekPlans[ath.id][WEEK_ID]=plan;
  await saveState();
  toast(`DUP Semana ${weekNum} aplicada ✓`,'success');goView('ath-detail');
}

function initCompState(ath){
  if(!ath.compPlan)ath.compPlan={};
  const sport=ath.sport;
  const lifts=sport==='wl'?['snatch','clean_jerk']:sport==='pl'?['squat','bench','deadlift']:['snatch','clean_jerk','squat','bench','deadlift'];
  lifts.forEach(id=>{
    if(!ath.compPlan[id]){
      const orm=ath.oneRMs?.[id]?.value||0;
      ath.compPlan[id]={
        attempt1:roundLoad(orm*0.88,id),
        attempt2:roundLoad(orm*0.93,id),
        attempt3:roundLoad(orm*0.98,id),
        results:{1:null,2:null,3:null}, // null=pending, true=white, false=red
      };
    }
  });
}

const LIVE_BIAS={
  conservador:{2:1.02,3:1.015,lbl:'Conservador'},
  moderado:{2:1.03,3:1.02,lbl:'Moderado'},
  agresivo:{2:1.045,3:1.035,lbl:'Agresivo'}
};
function _liveLifts(ath){
  const s=ath.sport;
  return s==='wl'?['snatch','clean_jerk']:s==='pl'?['squat','bench','deadlift']:['snatch','clean_jerk','squat','bench','deadlift'];
}
function _liveCurrent(ath){
  const lifts=_liveLifts(ath);
  for(const lid of lifts){
    const p=ath.compPlan[lid];
    for(let n=1;n<=3;n++){if(p.results[n]===null)return{liftId:lid,n};}
  }
  return null;
}
function setLiveBias(b){
  const ath=getAth();if(!ath)return;
  ath.compBias=b;
  const cur=_liveCurrent(ath);
  if(cur&&cur.n>1){
    const p=ath.compPlan[cur.liftId];
    if(p.results[cur.n-1]===true){
      p['attempt'+cur.n]=roundLoad(p['attempt'+(cur.n-1)]*LIVE_BIAS[b][cur.n],cur.liftId);
    }
  }
  saveState();render();
}
function editLiveKg(v){
  const ath=getAth();if(!ath)return;
  const cur=_liveCurrent(ath);if(!cur)return;
  ath.compPlan[cur.liftId]['attempt'+cur.n]=roundLoad(parseFloat(v)||0,cur.liftId);
  saveState();render();
}
function liveResult(success){
  const ath=getAth();if(!ath)return;
  const cur=_liveCurrent(ath);if(!cur)return;
  const p=ath.compPlan[cur.liftId];
  p.results[cur.n]=success;
  if(cur.n<3&&p.results[cur.n+1]===null){
    const bias=LIVE_BIAS[ath.compBias||'moderado'];
    const base=p['attempt'+cur.n];
    p['attempt'+(cur.n+1)]=success?roundLoad(base*bias[cur.n+1],cur.liftId):base;
  }
  playBeep();
  if(navigator.vibrate)navigator.vibrate(success?[40]:[80,40,80]);
  saveState();render();
}
function vCompLive(){
  const ath=getAth();if(!ath){goView('ath-detail');return'';}
  initCompState(ath);
  if(!ath.compBias)ath.compBias='moderado';
  const lifts=_liveLifts(ath);
  const liftNames={snatch:'Arrancada',clean_jerk:'Dos Tiempos',squat:'Sentadilla',bench:'Banca',deadlift:'Peso Muerto'};
  let total=0;
  lifts.forEach(lid=>{
    const p=ath.compPlan[lid];
    total+=p.results[3]===true?p.attempt3:p.results[2]===true?p.attempt2:p.results[1]===true?p.attempt1:0;
  });
  const back=S.role==='coach'?'ath-detail':'ath-home';
  const cur=_liveCurrent(ath);
  const biasChips=Object.keys(LIVE_BIAS).map(k=>`<button class="cl-bias-chip ${ath.compBias===k?'on':''}" onclick="setLiveBias('${k}')">${LIVE_BIAS[k].lbl}</button>`).join('');
  const prog=lifts.map(lid=>{
    const p=ath.compPlan[lid];
    const chips=[1,2,3].map(n=>{
      const r=p.results[n];
      const cls=r===true?'ok':r===false?'no':'';
      const mark=r===true?'✓':r===false?'✗':'•';
      const isCur=cur&&cur.liftId===lid&&cur.n===n;
      return `<span class="cl-chip ${cls} ${isCur?'cur':''}">${p['attempt'+n]||'—'}<small>${mark}</small></span>`;
    }).join('');
    return `<div class="cl-prog-row"><span class="cl-prog-lift">${liftNames[lid]}</span><div class="cl-chips">${chips}</div></div>`;
  }).join('');
  let focus;
  if(cur){
    const p=ath.compPlan[cur.liftId];
    const kg=p['attempt'+cur.n];
    const orm=ath.oneRMs?.[cur.liftId]?.value||0;
    const step=EX_DB[cur.liftId]?.olympic?'2.5':'0.5';
    focus=`<div class="cl-focus">
      <div class="cl-lift">${liftNames[cur.liftId]}</div>
      <div class="cl-attn">Intento ${cur.n}°</div>
      <input class="cl-kg" type="number" step="${step}" value="${kg||''}" inputmode="decimal" onchange="editLiveKg(this.value)">
      <div class="cl-pct">${orm&&kg?Math.round(kg/orm*100)+'% del 1RM':'kg'}</div>
      <div class="cl-actions">
        <button class="cl-btn ok" onclick="liveResult(true)">✓<small>VÁLIDO</small></button>
        <button class="cl-btn no" onclick="liveResult(false)">✗<small>NULO</small></button>
      </div>
    </div>`;
  }else{
    const idx=ath.sport==='pl'
      ?(ath.bodyWeight?`Wilks: <strong class="or">${calcWilks(total,ath.bodyWeight,true)||'—'}</strong>`:'')
      :(ath.bodyWeight?`Sinclair: <strong class="or">${calcSinclair(total,ath.bodyWeight,true)||'—'}</strong>`:'');
    focus=`<div class="cl-focus done">
      <div class="cl-attn">🏁 Competencia finalizada</div>

    </div>`;

    <button class="back-btn" onclick="goView('${back}')">←</button>
    <div class="topbar-title">🔴 EN VIVO · ${ath.name||''}</div>
  </div>
  <div class="screen pb cl-wrap">
    <div class="cl-total">
      <div class="cap">TOTAL REAL</div>
      <div class="cl-total-val">${total}<span style="font-size:1.2rem">kg</span></div>
    </div>

    </div>

}

/* ══════════════════════════════════════════════════
   VBT ESTIMADO  (Sesión 4 · #2)
   Curvas carga-velocidad validadas (MPV en m/s):
   - Sentadilla: Sánchez-Medina et al. 2017 (full squat), R²=0.958
   - Banca: González-Badillo & Sánchez-Medina 2010, R²=0.98
   - Peso muerto: aproximación lineal (evidencia escasa) → baja confianza
   - Olímpicos: excluidos (movimiento balístico, no aplica MPV→%1RM)
   Estimación poblacional. NO sustituye un encoder. Ajuste de carga
   anclado al RPE real reportado (no a la velocidad estimada).
══════════════════════════════════════════════════ */
function vbtModel(exId){
  const ex=EX_DB[exId];if(!ex)return null;
  if(ex.olympic)return{model:'none',conf:'none'};
  if(ex.pattern==='squat')return{model:'squat',conf:'alta'};
  if(ex.pattern==='push')return{model:'bench',conf:'alta'};
  if(ex.pattern==='hinge')return{model:'hinge',conf:'aprox'};
  return null;
}
function vbtMPV(model,pct){
  if(pct==null||pct<=0)return null;
  if(model==='squat')return -0.00006977*pct*pct-0.005861*pct+1.608;
  if(model==='bench'){
    const a=8.4326,b=-73.501,c=112.33-pct;
    const disc=b*b-4*a*c;if(disc<0)return null;
    return(-b-Math.sqrt(disc))/(2*a);
  }
  if(model==='hinge')return Math.max(0.12,0.18+(100-pct)*0.0088);
  return null;
}
function vbtZone(pct){
  if(pct>=90)return{z:'Fuerza máxima',c:'var(--danger)'};
  if(pct>=80)return{z:'Fuerza',c:'var(--or)'};
  if(pct>=70)return{z:'Fuerza-hipertrofia',c:'var(--both)'};
  if(pct>=60)return{z:'Hipertrofia / potencia',c:'var(--pl)'};
  return{z:'Velocidad-potencia',c:'var(--ok)'};
}
function goVBT(){goView('vbt');}
function vVBT(){
  const ath=getAth();if(!ath){goView('ath-detail');return'';}
  const sess=getSess(S.ui.curSessId);
  if(!sess){return`<div class="topbar"><button class="back-btn" onclick="goView('sess-exec')">←</button><div class="topbar-title">VBT ESTIMADO</div></div><div class="screen"><div class="empty"><div class="empty-icon">📊</div><div class="muted">Abrí una sesión para ver el VBT estimado.</div></div></div>`;}
  const cards=sess.exercises.map(ex=>{
    const exId=ex.exerciseId;const nm=exName(exId);
    const m=vbtModel(exId);
    if(!m)return'';
    if(m.model==='none'){
      return`<div class="card mb12" style="cursor:default">
        <div class="row mb4"><div class="d3">${nm}</div><div class="sp"></div><span class="vbt-conf none">No aplica</span></div>
        <div class="muted small" style="line-height:1.6">Los movimientos olímpicos son <strong>balísticos</strong>: la barra se mueve rápido incluso cerca del máximo. La relación MPV→%1RM de González-Badillo no está validada para ellos; se monitorean con <strong>velocidad pico</strong>, no MPV. Por eso quedan fuera del estimador.</div>
      </div>`;
    }
    const orm=ath.oneRMs?.[exId]?.value||0;
    const confLbl=m.conf==='alta'?'Alta confianza':'Aproximado';
    if(!orm){
      return`<div class="card mb12" style="cursor:default">
        <div class="row mb4"><div class="d3">${nm}</div><div class="sp"></div><span class="vbt-conf ${m.conf}">${confLbl}</span></div>
        <div class="muted small">Cargá el 1RM de este ejercicio para estimar la velocidad.</div>
      </div>`;
    }
    // %1RM de las series programadas (únicos, ordenados desc)
    const setPcts=[...new Set((ex.sets||[]).map(s=>parseFloat(s.pct)).filter(p=>p>0))].sort((a,b)=>b-a);
    const rows=(setPcts.length?setPcts:[]).map(p=>{
      const mpv=vbtMPV(m.model,p);const z=vbtZone(p);
      const kg=roundLoad(orm*p/100,exId);
      return`<div class="vbt-row hi">
        <div><div class="vbt-pct">${p}%</div></div>
        <div class="vbt-kg">${kg} kg</div>
        <div class="vbt-mpv">${mpv!=null?mpv.toFixed(2):'—'}<small>M/S</small></div>
        <div class="vbt-zone" style="color:${z.c}">${z.z}</div>
      </div>`;
    }).join('');
    // curva de referencia
    const ref=[90,80,70,60,50].map(p=>{
      const mpv=vbtMPV(m.model,p);
      return`<div class="vbt-ref-chip"><div class="p">${p}%</div><div class="v">${mpv!=null?mpv.toFixed(2):'—'}</div></div>`;
    }).join('');
    return`<div class="card mb12" style="cursor:default">
      <div class="row mb8"><div class="d3">${nm}</div><div class="sp"></div><span class="vbt-conf ${m.conf}">${confLbl}</span></div>
      ${rows?`<div class="cap mb4">SERIES DE HOY</div>${rows}`:'<div class="muted small mb8">Esta sesión no tiene %1RM cargados en las series.</div>'}
      <div class="cap mt12 mb4">CURVA DE REFERENCIA · MPV (m/s)</div>
      <div class="vbt-ref">${ref}</div>
    </div>`;
  }).join('');
  return`<div class="topbar">
    <button class="back-btn" onclick="goView('sess-exec')">←</button>
    <div class="topbar-title">📊 VBT ESTIMADO</div>
  </div>
  <div class="screen pb">
    <div class="card card-or mb16" style="cursor:default">
      <div class="cap mb4">CÓMO LEERLO</div>
      <div class="muted small" style="line-height:1.6">Velocidad <strong>estimada</strong> de la barra según el %1RM, por ejercicio. Es una referencia poblacional, <strong>no una medición</strong>: la variabilidad entre personas es alta. Si a un mismo %1RM sentís la barra mucho más lenta de lo esperado, es señal de fatiga o técnica. El <strong>ajuste de carga</strong> se decide por tu <strong>RPE real</strong>, no por este número.</div>
    </div>
    ${cards||'<div class="empty"><div class="empty-icon">📊</div><div class="muted">Sin ejercicios con modelo VBT en esta sesión.</div></div>'}
  </div>`;
}

   SERVICE WORKER
══════════════════════════════════════════════════ */
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  const code=`const CACHE='vcfit-strength-v1';
  self.addEventListener('install',e=>{self.skipWaiting();});
  self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(c=>c!==CACHE).map(c=>caches.delete(c)))));self.clients.claim();});
  self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`;
  const blob=new Blob([code],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(e=>console.warn('SW:',e));
}

function vGlossary(){
  const isCoach=S.role==='coach';
  const back=isCoach?'coach-home':'ath-home';
  const cats=[['wl','🏋️ Halterofilia'],['pl','⚡ Powerlifting'],['prog','📊 Carga y programación'],['vbt','📈 Velocidad (VBT)']];
  const body=cats.map(([ck,clabel])=>{
    const items=Object.entries(GLOSARIO).filter(([k,v])=>v.cat===ck).sort((a,b)=>a[1].t.localeCompare(b[1].t,'es'));
    if(!items.length)return'';
    const cards=items.map(([k,v])=>{
      const search=(v.t+' '+v.s+' '+(v.x||'')).toLowerCase().replace(/"/g,'');
      return`<div class="glos-item card mb8" data-s="${search}">
        <div class="bold" style="color:var(--or);margin-bottom:4px">${v.t}</div>
        <div style="line-height:1.5">${v.s}</div>
        ${isCoach&&v.x?`<div class="muted small" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span class="cap" style="font-size:.58rem">Técnico</span><br><span style="line-height:1.5">${v.x}</span></div>`:''}
      </div>`;
    }).join('');
    return`<div class="glos-cat"><div class="cap mb8" style="margin-top:16px;color:var(--text2)">${clabel}</div>${cards}</div>`;
  }).join('');
  return`<div class="topbar">
    <button class="back-btn" onclick="goView('${back}')">←</button>
    <div class="topbar-title">📖 TÉRMINOS</div>
  </div>

    <input class="inp mb8" type="text" placeholder="Buscar término…" oninput="filterGlossary(this.value)">
    <div class="muted small mb4">${Object.keys(GLOSARIO).length} términos${isCoach?' · ves definición simple y técnica':''}</div>
    ${body}
    <div id="glos-empty" class="muted" style="display:none;text-align:center;padding:24px">Sin resultados</div>
  </div>`;
}

/* Filtro en vivo sin re-render (no pierde foco del input) */
function filterGlossary(q){
  q=(q||'').trim().toLowerCase();
  let any=false;
  document.querySelectorAll('.glos-item').forEach(el=>{
    const vis=(!q||(el.getAttribute('data-s')||'').includes(q));
    el.style.display=vis?'':'none';
    if(vis)any=true;
  });
  document.querySelectorAll('.glos-cat').forEach(cat=>{
    const anyVis=Array.from(cat.querySelectorAll('.glos-item')).some(i=>i.style.display!=='none');
    cat.style.display=anyVis?'':'none';
  });
  const emp=document.getElementById('glos-empty');
  if(emp)emp.style.display=any?'none':'';
}

/* ── CRONÓMETRO DE SESIÓN ──────────────────────── */
let sessClock={sessId:null,startMs:0,accumMs:0,paused:false,interval:null};
function startSessClock(sessId){
  if(sessClock.sessId===sessId&&sessClock.startMs)return; // ya corriendo para esta sesión: no reiniciar
  clearInterval(sessClock.interval);
  sessClock={sessId,startMs:Date.now(),accumMs:0,paused:false,interval:null};
  sessClock.interval=setInterval(tickSessClock,1000);
}
function sessClockElapsedMs(){
  if(!sessClock.startMs)return 0;
  let ms=sessClock.accumMs;
  if(!sessClock.paused)ms+=Date.now()-sessClock.startMs;
  return ms;
}
function tickSessClock(){
  const el=document.getElementById('sess-clock');
  if(el)el.textContent=fmtClock(sessClockElapsedMs());
}
function toggleSessPause(){
  if(!sessClock.sessId)return;
  if(sessClock.paused){sessClock.startMs=Date.now();sessClock.paused=false;}
  else{sessClock.accumMs+=Date.now()-sessClock.startMs;sessClock.paused=true;}
  render();
}
function stopSessClock(){
  clearInterval(sessClock.interval);
  sessClock={sessId:null,startMs:0,accumMs:0,paused:false,interval:null};
}
function fmtClock(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60,p=n=>String(n).padStart(2,'0');
  return h>0?`${h}:${p(m)}:${p(ss)}`:`${p(m)}:${p(ss)}`;
}

function selectRmLift(id){ S.ui.rmLift=id; render(); }

function vRmHistory(){
  const ath=getAth();
  const back=S.role==='coach'?'ath-detail':'ath-home';
  const head=`<div class="topbar">
    <button class="back-btn" onclick="goView('${back}')">←</button>
    <div class="topbar-title">📈 HISTORIAL 1RM${ath&&ath.name?' — '+ath.name.toUpperCase():''}</div>
  </div>`;
  if(!ath) return head+`<div class="muted" style="padding:20px">Seleccioná un atleta primero.</div>`;
  const hist=Array.isArray(ath.rmHistory)?ath.rmHistory:[];
  // Agrupar por lift, solo puntos con valor numérico válido
  const byLift={};
  hist.forEach(p=>{ if(p&&p.lift&&typeof p.estimated==='number'&&!isNaN(p.estimated)){ (byLift[p.lift]=byLift[p.lift]||[]).push(p); } });
  const lifts=Object.keys(byLift);
  if(!lifts.length){
    return head+`<div style="padding:26px 18px;text-align:center;color:var(--text2)">
      <div style="font-size:2.2rem;margin-bottom:8px">📊</div>
      <div style="font-weight:600;color:var(--text)">Sin registros todavía</div>
      <div style="font-size:.85rem;margin-top:6px;line-height:1.5">Los 1RM se guardan solos al completar series con carga real, o cuando cargás un 1RM a mano en la pantalla de 1RMs.</div>
    </div>`;
  }
  let sel=S.ui.rmLift; if(!sel||!byLift[sel]) sel=lifts[0];
  // Selector de ejercicio (solo lifts con datos — data-driven)
  const chips=lifts.map(id=>{ const on=id===sel;
    return `<button onclick="selectRmLift('${id}')" style="padding:5px 11px;border-radius:var(--radius2);border:1px solid ${on?'var(--or)':'var(--border)'};background:${on?'var(--or-dim)':'transparent'};color:${on?'var(--or)':'var(--text2)'};font-family:var(--fr);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto">${exName(id)}</button>`;
  }).join('');
  const chipBar=`<div style="display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px">${chips}</div>`;

  // Serie cronológica del lift seleccionado
  const pts=byLift[sel].map(p=>({ t:Date.parse(p.date)||0, v:p.estimated, manual:!!p.manual, date:p.date })).sort((a,b)=>a.t-b.t);
  const vals=pts.map(p=>p.v);
  const prVal=Math.max(...vals), prIdx=vals.lastIndexOf(prVal);
  const cur=(ath.oneRMs&&ath.oneRMs[sel])?ath.oneRMs[sel].value:null;
  const delta=pts.length>=2?(pts[pts.length-1].v-pts[0].v):0;

  // ── SVG nativo (sin librerías) ──
  const W=340,H=196,padL=40,padR=14,padT=16,padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  let vmin=Math.min(...vals), vmax=Math.max(...vals);
  if(vmin===vmax){ vmin-=5; vmax+=5; } else { const pd=(vmax-vmin)*0.14; vmin-=pd; vmax+=pd; }
  const ts=pts.map(p=>p.t); const tmin=Math.min(...ts), tmax=Math.max(...ts);
  const xOf=(p,i)=> padL+(tmax===tmin ? (pts.length===1?plotW/2:plotW*i/(pts.length-1)) : plotW*(p.t-tmin)/(tmax-tmin));
  const yOf=(v)=> padT+plotH*(1-(v-vmin)/(vmax-vmin));
  const gridVals=[vmax,(vmax+vmin)/2,vmin];
  const grid=gridVals.map(gv=>{ const y=yOf(gv);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`+
           `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text3)" font-family="var(--fr)">${Math.round(gv)}</text>`;
  }).join('');
  const poly=pts.length>=2 ? `<polyline points="${pts.map((p,i)=>xOf(p,i).toFixed(1)+','+yOf(p.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--or)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  const dots=pts.map((p,i)=>{ const x=xOf(p,i).toFixed(1), y=yOf(p.v).toFixed(1);
    if(i===prIdx) return `<circle cx="${x}" cy="${y}" r="5" fill="var(--ok)" stroke="var(--bg)" stroke-width="1.5"/>`;
    return p.manual
      ? `<circle cx="${x}" cy="${y}" r="4" fill="var(--or)"/>`
      : `<circle cx="${x}" cy="${y}" r="4" fill="var(--bg)" stroke="var(--or)" stroke-width="2"/>`;
  }).join('');
  const xLab=`<text x="${padL}" y="${H-10}" text-anchor="start" font-size="9" fill="var(--text3)" font-family="var(--fr)">${fmtDate(pts[0].t)}</text>`+
            (pts.length>1?`<text x="${W-padR}" y="${H-10}" text-anchor="end" font-size="9" fill="var(--text3)" font-family="var(--fr)">${fmtDate(pts[pts.length-1].t)}</text>`:'');
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${poly}${dots}${xLab}</svg>`;
  const note=pts.length<2?`<div style="text-align:center;color:var(--text3);font-size:.78rem;margin-top:4px">Un solo registro. Necesitás 2+ para trazar la curva de evolución.</div>`:'';
  const legend=`<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:.72rem;color:var(--text2);font-family:var(--fr)">
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--or);margin-right:4px;vertical-align:middle"></span>Medido / declarado</span>
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--or);box-sizing:border-box;margin-right:4px;vertical-align:middle"></span>Estimado (Epley)</span>
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:middle"></span>PR</span>
  </div>`;

  const stat=(label,val,color)=>`<div style="flex:1;background:var(--s2);border:1px solid var(--border);border-radius:var(--radius2);padding:9px;text-align:center">
    <div style="font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">${label}</div>
    <div style="font-family:var(--fd);font-size:1.4rem;color:${color}">${val}<span style="font-size:.7rem;color:var(--text3)"> kg</span></div>
  </div>`;
  const stats=`<div style="display:flex;gap:8px;margin:10px 0">
    ${stat('Actual', cur!=null?cur:'—', 'var(--text)')}
    ${stat('PR histórico', prVal, 'var(--ok)')}
    ${stat('Progreso', (delta>0?'+':'')+delta.toFixed(0), delta>0?'var(--ok)':(delta<0?'var(--danger)':'var(--text2)'))}
  </div>`;

  return head+`<div style="padding:0 4px 24px">
    ${chipBar}
    <div style="font-family:var(--fd);font-size:1.3rem;color:var(--or);letter-spacing:.5px;margin-bottom:1px">${exName(sel)}</div>
    <div style="font-size:.72rem;color:var(--text3);margin-bottom:6px">${pts.length} registro${pts.length!==1?'s':''}</div>
    ${stats}
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px 4px">${svg}${note}${legend}</div>
  </div>`;
}


function _grpSets(sets){
  const g=[];
  (sets||[]).forEach(s=>{
    const last=g[g.length-1];
    if(last&&last.reps===s.reps&&last.pct===s.pct) last.n++;
    else g.push({n:1,reps:s.reps,pct:s.pct});
  });
  return g;
}

function buildPrintPlan(ath){
  const LVL={beginner:'Principiante',intermediate:'Intermedio',advanced:'Avanzado',elite:'Elite'};
  const SPT={wl:'Halterofilia',pl:'Powerlifting',both:'Halterofilia + Powerlifting'};
  const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const blocks=ath.blocks||[];
  const genStr=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'});
  const goalTxt=ath.goal?(ath.goal.charAt(0).toUpperCase()+ath.goal.slice(1)):null;
  const meta=[LVL[ath.level]||ath.level, goalTxt, SPT[ath.sport]||ath.sport, ath.days?ath.days+' días/sem':null].filter(Boolean).join('  ·  ');

  let html=`<div class="pr-doc">
    <div class="pr-head">
      <div class="pr-brand">VC FIT <span>STRENGTH</span></div>
      <div class="pr-sub">Programa de entrenamiento</div>
    </div>
    <div class="pr-athlete">
      <div class="pr-name">${ath.name||'Atleta'}</div>
      <div class="pr-meta">${meta}</div>
    </div>`;

  // 1RMs
  const orms=ath.oneRMs||{};
  const ormKeys=Object.keys(orms).filter(k=>orms[k]&&typeof orms[k].value==='number');
  if(ormKeys.length){
    html+=`<div class="pr-section-t">Marcas máximas (1RM)</div><table class="pr-tbl"><thead><tr><th>Ejercicio</th><th class="pr-r">1RM</th><th class="pr-r">Fecha</th></tr></thead><tbody>`;
    ormKeys.forEach(k=>{ const o=orms[k]; html+=`<tr><td>${exName(k)}</td><td class="pr-r">${o.value} kg</td><td class="pr-r">${o.date?fmtDate(o.date):'—'}</td></tr>`; });
    html+=`</tbody></table>`;
  }

  if(!blocks.length){
    html+=`<div class="pr-empty">Este atleta todavía no tiene un programa generado. Usá ⚡ Auto-Prescribir para crearlo.</div>`;
  }

  const trainIdxs=getTrainDayIdxs(ath.days||3);
  blocks.forEach(blk=>{
    const ti=BLK[blk.type]||{label:blk.type,color:'#FF6B00'};
    html+=`<div class="pr-block" style="border-color:${ti.color}">
      <div class="pr-block-h" style="color:${ti.color}">${blk.name||ti.label}<span class="pr-block-meta">${fdStr(blk.startDate)} → ${fdStr(blk.endDate)} · ${blk.weeks||'?'} sem.</span></div>`;
    let cur=new Date(blk.startDate+'T00:00:00');
    const end=new Date(blk.endDate+'T00:00:00');
    let weekNum=0, guard=0;
    while(cur<end && guard++<60){
      weekNum++;
      const wkDates=[];
      for(let d=0;d<7&&cur<end;d++){ wkDates.push(cur.toISOString().split('T')[0]); const nc=new Date(cur); nc.setDate(nc.getDate()+1); cur=nc; }
      const planDays=wkDates.map((dt,di)=>({dt,di})).filter(o=>trainIdxs.includes(o.di)&&ath.fullPlan&&ath.fullPlan[o.dt]);
      if(!planDays.length) continue;
      const wkPct=ath.fullPlan[planDays[0].dt]&&ath.fullPlan[planDays[0].dt].weekPct;
      html+=`<div class="pr-week">Semana ${weekNum}${wkPct?` — ${wkPct}%`:''}</div>`;
      planDays.forEach(({dt})=>{
        const dp=ath.fullPlan[dt]; const exs=dp.exercises||[];
        html+=`<div class="pr-day">${DOW[new Date(dt+'T00:00:00').getDay()]} · ${fdStr(dt)}</div>`;
        html+=`<table class="pr-tbl pr-sess"><thead><tr><th>Ejercicio</th><th>Series</th><th class="pr-r">Carga</th></tr></thead><tbody>`;
        exs.forEach(ex=>{
          const groups=_grpSets(ex.sets);
          const orm=orms[ex.exerciseId]?orms[ex.exerciseId].value:null;
          if(!groups.length){ html+=`<tr><td>${exName(ex.exerciseId)}</td><td>—</td><td class="pr-r">—</td></tr>`; return; }
          groups.forEach((g,gi)=>{
            const pctTxt=g.pct?` @ ${g.pct}%`:'';
            const load=(orm&&g.pct)?`${roundLoad(orm*g.pct/100, ex.exerciseId)} kg`:'—';
            html+=`<tr><td>${gi===0?exName(ex.exerciseId):''}</td><td>${g.n} × ${g.reps||'—'}${pctTxt}</td><td class="pr-r">${load}</td></tr>`;
          });
        });
        html+=`</tbody></table>`;
      });
    }
    html+=`</div>`;
  });

  html+=`<div class="pr-foot">Generado con VC Fit Strength · ${genStr}</div></div>`;
  return html;
}

function printPlan(){
  const ath=getAth();
  if(!ath){ if(typeof toast==='function')toast('Seleccioná un atleta primero','error'); return; }
  let root=document.getElementById('print-root');
  if(!root){ root=document.createElement('div'); root.id='print-root'; document.body.appendChild(root); }
  root.innerHTML=buildPrintPlan(ath);
  window.print();
}

function init(){
  loadLocal();_epSport='both';render();initFirebase();registerSW();
  // Live date update for presc view
  document.addEventListener('input',e=>{if(e.target.id==='presc-goal-date')updatePrescWeeks();});
}
init();
</script>
